server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback - client-side routing (react-router) needs every
    # unknown path to resolve to index.html, not a 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached: it references the current
    # build's content-hashed JS/CSS filenames by name. If a browser (or an
    # intermediate proxy) caches an old index.html across a rebuild, it will
    # keep asking for JS chunks that no longer exist in the new image once
    # they 404 mid-load, React never mounts - which looks exactly like a
    # page stuck on its loading spinner on reload, since nothing after that
    # point ever runs. The hashed assets below are safe to cache forever
    # precisely because their filename changes whenever their content does;
    # index.html is the one file that always has to be revalidated.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
