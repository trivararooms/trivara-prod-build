<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/trivara-favicon.png" />
    <title>TRIVARA</title>
    <meta name="description" content="Trivara handpicks extraordinary vacation rentals and short-term stays around the world." />
    <meta name="author" content="Trivara" />
    <meta name="robots" content="index, follow" />

    <!-- Pre-hydration fallback only - every route overrides these via the
         <SEO> component (src/components/SEO.tsx) once React mounts. A
         crawler that can't execute JS (most social-media link previews)
         only ever sees this static version, which is why it points at our
         own favicon rather than a placeholder image. -->
    <meta property="og:title" content="Trivara" />
    <meta property="og:description" content="Trivara handpicks extraordinary vacation rentals and short-term stays around the world." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/trivara-favicon.png" />
    <meta property="og:site_name" content="Trivara" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Trivara" />
    <meta name="twitter:description" content="Trivara handpicks extraordinary vacation rentals and short-term stays around the world." />
    <meta name="twitter:image" content="/trivara-favicon.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
